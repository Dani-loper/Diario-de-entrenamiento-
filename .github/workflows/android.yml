name: App Android
# Compila el APK de la app Android (Capacitor) con los mismos archivos que la web.
# - En cada pull request: compila para comprobar que no se rompe (el APK queda como artefacto).
# - Al fusionar en main: además publica el APK en «Releases» para descargarlo desde el móvil.
# Firma: con los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD
# (Settings › Secrets and variables › Actions). Sin ellos se genera un APK de prueba que NO se puede actualizar encima.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Clave de firma
        id: firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "firmado=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma: se genera un APK de prueba (no se podrá actualizar encima)."
            echo "firmado=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.firma.outputs.firmado }}" = "si" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../diario-entrenamiento-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../diario-entrenamiento-$VERSION_NAME-prueba.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: diario-entrenamiento-*.apk
      - name: Publicar en Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.firma.outputs.firmado == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: App Android ${{ env.VERSION_NAME }}
          files: diario-entrenamiento-*.apk
          body: |
            Descarga el archivo `.apk` desde el móvil Android y ábrelo para instalar (la primera vez Android pedirá permitir instalar apps de esta fuente).
            Las versiones nuevas se instalan encima sin perder los datos.
