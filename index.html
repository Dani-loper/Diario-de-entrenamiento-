<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Diario de entrenamiento</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="timer" class="timer hidden" role="status">
    <span id="timer-label">Descanso</span>
    <strong id="timer-value">0:00</strong>
    <button data-action="timer-add" data-sec="-15">−15</button>
    <button data-action="timer-add" data-sec="15">+15</button>
    <button data-action="timer-save-rest" aria-label="Parar y guardar el descanso en la serie"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg> Parar</button>
    <button data-action="timer-stop" aria-label="Descartar sin guardar">✕</button>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="sessions"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg><span>Calendario</span></a>
    <a href="#/exercises" data-tab="exercises"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg><span>Progreso</span></a>
    <a href="#/records" data-tab="records"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg><span>Récords</span></a>
    <a href="#/settings" data-tab="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Ajustes</span></a>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>

  <input type="file" id="video-file" accept="video/*" class="hidden">
  <!-- capture: abre directamente la cámara para grabar (en Android, la grabadora de vídeo del sistema) -->
  <input type="file" id="video-cam" accept="video/*" capture="environment" class="hidden">

  <!-- storage.js carga los datos (IndexedDB) y después el resto de la app, en orden. -->
  <script src="native.js"></script>
  <script src="catalog.js"></script>
  <script src="storage.js"></script>
</body>
</html>
