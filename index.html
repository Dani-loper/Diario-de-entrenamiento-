<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Diario de entrenamiento</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="timer" class="timer hidden" role="status">
    <span id="timer-label">Descanso</span>
    <strong id="timer-value">0:00</strong>
    <button data-action="timer-add" data-sec="-15">−15</button>
    <button data-action="timer-add" data-sec="15">+15</button>
    <button data-action="timer-stop" aria-label="Parar">✕</button>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="sessions">🗓️<span>Sesiones</span></a>
    <a href="#/exercises" data-tab="exercises">📈<span>Progreso</span></a>
    <a href="#/settings" data-tab="settings">⚙️<span>Ajustes</span></a>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
